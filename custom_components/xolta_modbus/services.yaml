set_override:
  target:
    entity:
      integration: xolta_modbus
      domain: select
  fields:
    mode:
      required: true
      example: stop
      selector:
        select:
          translation_key: override_mode
          options:
            - auto
            - stop
            - self_consumption
    duration:
      required: false
      example: 4
      selector:
        number:
          min: 0.25
          max: 48
          step: 0.25
          unit_of_measurement: h
          mode: box
